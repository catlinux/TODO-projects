# Vhost de todo-project.invierteconcriterio.es: proxy inverso al contenedor web
# (Caddy), que escucha solo en 127.0.0.1:8083. Esta es la copia versionada; la
# activa vive en /etc/apache2/sites-available/ (la parte 443 la crea certbot).
#
# ProxyPreserveHost y X-Forwarded-Proto no son opcionales: la cookie de sesión
# es Secure y la API debe saber que la conexión original fue HTTPS.

<VirtualHost *:80>
    ServerName todo-project.invierteconcriterio.es

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8083/
    ProxyPassReverse / http://127.0.0.1:8083/

    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/todo-project.invierteconcriterio.es-error.log
    CustomLog ${APACHE_LOG_DIR}/todo-project.invierteconcriterio.es-access.log combined
</VirtualHost>
